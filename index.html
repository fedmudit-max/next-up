<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FB; --ink:#151B33; --muted:#566080; --line:#DADFEE;
  --accent:#FFD23F; --navy:#151B33;
  --cs:62%; --cl:34%;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1122; --ink:#EEF0FF; --muted:#9BA2C9; --line:#2A3050;
    --cs:70%; --cl:72%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1122; --ink:#EEF0FF; --muted:#9BA2C9; --line:#2A3050;
  --cs:70%; --cl:72%;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-bottom:110px; -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px}
.wrap.wide{max-width:920px}
.wrap.boardwide{max-width:960px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0;font-size:14px}

/* Do this now strip */
.pick{background:var(--accent);color:var(--navy);border-radius:16px;padding:16px 18px;margin-bottom:22px;max-width:720px}
.pick :focus-visible{outline-color:var(--navy)}
.pick-lead{margin:0 0 2px;font-weight:600;font-size:14px}
.pick-title{font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.12;letter-spacing:-.02em;margin:0 0 4px}
.pick-from{margin:0 0 14px;font-size:14px;font-weight:500;opacity:.8}
.pick-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:42px;font-weight:600;font-size:15px;cursor:pointer;line-height:1.1}
.btn.dark{background:var(--navy);color:var(--accent)}
.btn.line{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.pick.swap{animation:swap .22s ease-out}
@keyframes swap{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.on[style]{background:hsl(var(--h) var(--cs) var(--cl));border-color:transparent;color:#fff}
:root[data-theme="dark"] .chip.on[style]{color:#0E1122}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on[style]{color:#0E1122}}
.hint{margin:4px 0 0;font-size:14px;color:var(--muted)}

/* Home add row */
.add{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding:6px 0;margin:14px 0 4px;max-width:720px}
.add svg{flex:none;color:var(--muted)}
.add input[type=text]{flex:1;min-width:0;background:transparent;border:0;font-size:17px;padding:10px 0;min-height:44px}
.add input::placeholder{color:var(--muted)}
.add input:focus-visible{outline:none}
.add:focus-within{border-bottom-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.add select{flex:0 1 150px;min-width:0;background:transparent;border:0;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);padding:8px 4px;min-height:40px}
.add select option{color:#151B33}
.add button{flex:none;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}

/* Section headings */
.sec-h{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sec-h svg{flex:none;width:22px;height:22px}
.sec-h h3{font-weight:800;font-size:20px;letter-spacing:-.01em}
.n{font-size:14px;font-weight:600;color:var(--muted)}

/* Rows */
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);min-height:58px;position:relative}
.chk{flex:none;width:46px;height:46px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);margin-left:-10px;border-radius:50%}
.chk svg{width:26px;height:26px;display:block}
.chk .ck{stroke:var(--bg)}
.chk:active svg{transform:scale(.88)}
.rt{flex:1;min-width:0;padding:8px 0}
.txt{display:block;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.cat{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;margin-top:3px;color:hsl(var(--h) var(--cs) var(--cl))}
.cat i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px;vertical-align:middle}
.x{flex:none;width:40px;height:40px;border:0;background:transparent;color:var(--muted);border-radius:50%;cursor:pointer;display:grid;place-items:center;opacity:.75}
.x:hover,.x:focus-visible{opacity:1;color:var(--ink)}
.row[data-status="done"] .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.empty{color:var(--muted);padding:14px 0;margin:0;border-bottom:1px solid var(--line);font-size:15px}

/* Empty placeholder rows: blank lines you can type into */
.row.ph .phf{display:flex;align-items:center;gap:4px;width:100%}
.ph .pc{flex:none;width:46px;height:46px;display:grid;place-items:center;color:var(--muted);opacity:.35;margin-left:-10px}
.ph .pc svg{width:26px;height:26px}
.ph input{flex:1;min-width:0;background:transparent;border:0;font-size:17px;padding:12px 0;min-height:46px}
.ph input::placeholder{color:var(--muted);opacity:.5}
.ph input:focus-visible{outline:none}
.ph:focus-within{border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.ph .padd{display:none;flex:none;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;min-height:34px}
.ph:focus-within .padd,.ph input:not(:placeholder-shown)~.padd{display:inline-block}

/* Lists overview: every list visible, two columns */
.lgrid{column-count:2;column-gap:28px}
.lblock{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;margin:0 0 30px}
.lhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:0 0 8px;cursor:pointer;min-height:44px}
.ldot{flex:none;width:14px;height:14px;border-radius:50%;background:hsl(var(--h) var(--cs) var(--cl))}
.lname{display:block;flex:1;min-width:0;font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.lcount{flex:none;font-size:14px;font-weight:600;color:var(--muted);text-align:right}
.lhead svg{flex:none;color:var(--muted)}
.lblock .row{min-height:46px}
.lblock .rt{padding:6px 0}
.lblock .chk,.lblock .ph .pc{width:38px;height:38px;margin-left:-8px}
.lblock .chk svg,.lblock .ph .pc svg{width:22px;height:22px}
.lblock .txt{font-size:15px}
.lblock .x{width:32px;height:32px}
.lblock .x svg{width:15px;height:15px}
.lblock .ph input{font-size:15px;min-height:42px;padding:6px 0}
.lblock .ph .padd{padding:6px 11px;min-height:30px;font-size:12px}
@media (max-width:480px){
  .lgrid{column-gap:14px}
  .lhead{gap:6px}
  .lname{font-size:16px}
  .lblock .txt{font-size:14px}
  .lhead svg{display:none}
}

/* Opened list */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--muted);font-weight:600;padding:8px 8px 8px 0;margin-bottom:4px;cursor:pointer;min-height:40px}
.list-title{font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.05;letter-spacing:-.025em;color:hsl(var(--h) var(--cs) var(--cl))}
.list-q{color:var(--muted);margin:6px 0 18px}
.opened .rows{border-top:2px solid var(--ink)}

/* Home board: three columns side by side */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px;align-items:start}
.bcol{min-width:0}
@media (max-width:600px){
  .wrap.boardwide{padding-left:12px;padding-right:12px}
  .board{gap:8px}
  .bcol .sec-h{flex-wrap:wrap;gap:2px 6px;padding-bottom:6px}
  .bcol .sec-h svg{width:16px;height:16px}
  .bcol .sec-h h3{font-size:13px;line-height:1.15}
  .bcol .n{font-size:12px}
  .bcol .row{display:block;min-height:0;padding:2px 0 10px}
  .bcol .chk{width:36px;height:36px;margin:0 0 0 -6px}
  .bcol .chk svg{width:22px;height:22px}
  .bcol .rt{padding:0}
  .bcol .txt{font-size:13.5px;line-height:1.25}
  .bcol .cat{font-size:11px;margin-top:4px}
  .bcol .x{position:absolute;top:1px;right:-6px;width:34px;height:34px}
  .bcol .x svg{width:15px;height:15px}
  .bcol .empty{font-size:13px;padding:10px 0}
}

/* Nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav-in{pointer-events:auto;display:flex;gap:4px;background:var(--ink);padding:5px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.nav button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--bg);padding:11px 22px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;min-height:46px}
.nav button[aria-current="page"]{background:var(--accent);color:var(--navy)}
.nav :focus-visible{outline-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 10px 8px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s;max-width:calc(100% - 32px);text-align:center;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1}
.toast.act.show{pointer-events:auto}
.toast button{border:0;background:var(--accent);color:var(--navy);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;min-height:32px}
.toast:not(.act){padding-right:18px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav class="nav" aria-label="Main"><div class="nav-in" id="nav"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* Each list starts with one item: the most common thing people want from that list.
   The other four lines are empty placeholders you can type into. */
var CATS=[
 {id:'interest',name:'Interests',q:'What pulls your attention?',common:'Try a hobby you have never tried'},
 {id:'passion',name:'Passions',q:'What would you do for free?',common:'Spend an hour on something you love'},
 {id:'curiosity',name:'Curiosities',q:'What do you wonder about?',common:'Look up something you have always wondered about'},
 {id:'creativity',name:'Creativity',q:'What can you make right now?',common:'Draw, write or make something small'},
 {id:'purpose',name:'Purpose',q:'What do you want your time to count for?',common:'Write down what matters most to you'},
 {id:'courses',name:'Courses',q:'What are you ready to study?',common:'Finish one lesson of an online course'},
 {id:'books',name:'Books',q:'What will you read next?',common:'Read 20 pages of a book'},
 {id:'movies',name:'Movies',q:'What will you watch tonight?',common:'Watch a movie you have been meaning to see'},
 {id:'skills',name:'Skills to learn',q:'What do you want to be good at?',common:'Practise a new skill for 30 minutes'},
 {id:'places',name:'Places to visit',q:'Where do you want to go?',common:'Visit a place you have never been to'},
 {id:'languages',name:'Languages to learn',q:'Whose words do you want to understand?',common:'Practise a new language for 10 minutes'},
 {id:'money',name:'Ways to make money',q:'How could your time earn?',common:'Find one way to earn extra income'},
 {id:'products',name:'Products to build',q:'What is worth making?',common:'Write down a product idea'},
 {id:'jobs',name:'Jobs to do',q:'What have you been putting off?',common:'Clear your inbox'}
];
CATS.forEach(function(c,i){c.h=Math.round(i*360/CATS.length+10);});
var byId={};CATS.forEach(function(c){byId[c.id]=c;});
var LINES=5; /* every list shows five lines: filled items first, then empty placeholders */
var NOT_ON_HOME=['passion','purpose','money','products']; /* the other ten start on the Home board */

var KEY='nextup-v4';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.items))return d.items;}}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:state.items}));}catch(e){}}
function seedItems(){
  return CATS.map(function(c){return {id:uid(),cat:c.id,text:c.common,status:'todo',onHome:NOT_ON_HOME.indexOf(c.id)<0};});
}

var state={view:'home',cat:null,filter:'all',lastCat:'interest',pickId:null,flash:false,refocus:null,undo:null,items:load()||seedItems()};

var app=document.getElementById('app'),navEl=document.getElementById('nav'),toastEl=document.getElementById('toast'),toastTimer;
function toast(msg,withUndo){
  toastEl.textContent='';
  var s=document.createElement('span');s.textContent=msg;toastEl.appendChild(s);
  if(withUndo){var b=document.createElement('button');b.type='button';b.setAttribute('data-action','undo');b.textContent='Undo';toastEl.appendChild(b);}
  toastEl.classList.toggle('act',!!withUndo);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},withUndo?5000:1800);
}

var LABEL={todo:'To do',doing:'In progress',done:'Done'};
var EMPTY={doing:'Tap a circle to start one.',todo:'Nothing waiting.',done:'Nothing finished yet.'};
var NEXT={todo:'doing',doing:'done',done:'todo'};
var ACTION={todo:'Start',doing:'Finish',done:'Move back to to do'};

function homeItems(){return state.items.filter(function(i){return i.onHome&&(state.filter==='all'||i.cat===state.filter);});}

function choose(pool){
  var p=pool.filter(function(i){return i.status==='doing';});
  if(!p.length)p=pool.filter(function(i){return i.status==='todo';});
  return p.length?p[Math.floor(Math.random()*p.length)]:null;
}
function currentPick(pool){
  var it=state.items.find(function(i){return i.id===state.pickId;});
  if(!it||it.status==='done'||pool.indexOf(it)<0){it=choose(pool);state.pickId=it?it.id:null;}
  return it;
}
function shuffle(){
  var pool=homeItems().filter(function(i){return i.status!=='done'&&i.id!==state.pickId;});
  if(!pool.length){toast('That is the only open item in this view');return;}
  state.pickId=pool[Math.floor(Math.random()*pool.length)].id;
  state.flash=true;
}
function setStatus(id,to){
  var it=state.items.find(function(i){return i.id===id;});
  if(!it||it.status===to)return;
  var wasHome=it.onHome;
  it.status=to;if(to!=='todo')it.onHome=true;save();
  toast(!wasHome&&it.onHome?'Moved to Home as '+LABEL[to]:'Moved to '+LABEL[to]);
}
function addItem(cat,text,onHome){
  text=text.trim();if(!text)return;
  state.items.push({id:uid(),cat:cat,text:text,status:'todo',onHome:!!onHome});
  state.lastCat=cat;save();toast(onHome?'Added to To do':'Added to the list');
}
function removeItem(id){
  var idx=state.items.findIndex(function(i){return i.id===id;});
  if(idx<0)return;
  state.undo={item:state.items[idx],idx:idx};
  state.items.splice(idx,1);save();toast('Removed',true);
}
function undoRemove(){
  if(!state.undo)return;
  state.items.splice(Math.min(state.undo.idx,state.items.length),0,state.undo.item);
  state.undo=null;save();toast('Restored');
}

/* ---------- icons ---------- */
var ICON={
  todo:'<svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="10.5" stroke="currentColor" stroke-width="2"/></svg>',
  doing:'<svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M13 2.5a10.5 10.5 0 0 0 0 21z" fill="#FFD23F"/><circle cx="13" cy="13" r="10.5" stroke="currentColor" stroke-width="2"/></svg>',
  done:'<svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="currentColor"/><path class="ck" d="M8 13.5l3.5 3.5L18.5 9.5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
};

/* ---------- list pieces ---------- */
function row(i,showCat){
  var c=byId[i.cat];
  return '<li class="row" data-status="'+i.status+'" style="--h:'+c.h+'">'+
    '<button type="button" class="chk" data-action="cycle" data-id="'+i.id+'" aria-label="'+ACTION[i.status]+': '+esc(i.text)+'">'+ICON[i.status]+'</button>'+
    '<div class="rt"><span class="txt">'+esc(i.text)+'</span>'+(showCat?'<span class="cat"><i></i>'+esc(c.name)+'</span>':'')+'</div>'+
    '<button type="button" class="x" data-action="remove" data-id="'+i.id+'" aria-label="Delete: '+esc(i.text)+'">'+ICON.x+'</button></li>';
}
function phRow(c,k){
  return '<li class="row ph"><div class="phf" data-fixed="'+c.id+'"><span class="pc" aria-hidden="true">'+ICON.todo+'</span>'+
    '<input id="ph-'+c.id+'-'+k+'" type="text" placeholder="Add item" aria-label="Add item to '+esc(c.name)+'" autocomplete="off" maxlength="120">'+
    '<button type="button" class="padd" data-action="add">Add</button></div></li>';
}
/* filled items, then empty placeholder lines up to five (always at least one to type into) */
function listBody(c,items){
  var html=items.map(function(i){return row(i,false);}).join('');
  var n=Math.max(1,LINES-items.length);
  for(var k=0;k<n;k++)html+=phRow(c,k);
  return '<ul class="rows">'+html+'</ul>';
}
function sections(items,showCat){
  return '<div class="board">'+['todo','doing','done'].map(function(k){
    var list=items.filter(function(i){return i.status===k;});
    var body=list.length?'<ul class="rows">'+list.map(function(i){return row(i,showCat);}).join('')+'</ul>':'<p class="empty">'+EMPTY[k]+'</p>';
    return '<section class="bcol" aria-label="'+LABEL[k]+'"><div class="sec-h">'+ICON[k]+'<h3>'+LABEL[k]+'</h3><span class="n">'+list.length+'</span></div>'+body+'</section>';
  }).join('')+'</div>';
}
function addForm(defCat){
  var sel='<label class="sr" for="add-cat">List</label><select id="add-cat">'+CATS.map(function(c){return '<option value="'+c.id+'"'+(c.id===defCat?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select>';
  return '<div class="add">'+ICON.plus+'<label class="sr" for="add-text">New item</label>'+
    '<input id="add-text" type="text" placeholder="Add something to do" autocomplete="off" maxlength="120" required>'+sel+
    '<button type="button" data-action="add">Add</button></div>';
}
function chip(id,label,h){
  var on=state.filter===id;
  return '<button type="button" class="chip'+(on?' on':'')+'" data-action="filter" data-cat="'+id+'" aria-pressed="'+on+'"'+(h!=null?' style="--h:'+h+'"':'')+'>'+esc(label)+'</button>';
}

/* ---------- views ---------- */
function pickHtml(pool){
  var it=currentPick(pool);
  var cls='pick'+(state.flash?' swap':'');state.flash=false;
  if(!it)return '<section class="'+cls+'" aria-label="Suggestion"><p class="pick-lead">Nothing waiting</p><h2 class="pick-title">Add something you would like to do.</h2></section>';
  var doing=it.status==='doing';
  var primary=doing
    ?'<button type="button" class="btn dark" data-action="setstatus" data-id="'+it.id+'" data-to="done">Finish</button>'
    :'<button type="button" class="btn dark" data-action="setstatus" data-id="'+it.id+'" data-to="doing">Start this</button>';
  return '<section class="'+cls+'" aria-label="Suggestion">'+
    '<p class="pick-lead">'+(doing?'You are already on this one':'Do this now')+'</p>'+
    '<h2 class="pick-title">'+esc(it.text)+'</h2><p class="pick-from">'+esc(byId[it.cat].name)+'</p>'+
    '<div class="pick-actions">'+primary+'<button type="button" class="btn line" data-action="shuffle">Show another</button></div></section>';
}
function homeView(){
  var items=homeItems();
  var doing=state.items.filter(function(i){return i.onHome&&i.status==='doing';}).length;
  var done=state.items.filter(function(i){return i.onHome&&i.status==='done';}).length;
  var defCat=state.filter!=='all'?state.filter:state.lastCat;
  return '<header class="top"><h1 class="brand">Next Up</h1><p class="sub">'+doing+' in progress, '+done+' done</p></header>'+
    pickHtml(items)+
    '<div class="chips" role="group" aria-label="Filter by list">'+chip('all','All lists')+CATS.map(function(c){return chip(c.id,c.name,c.h);}).join('')+'</div>'+
    '<p class="hint">Tap a circle once to start, twice to finish.</p>'+
    addForm(defCat)+sections(items,true);
}
function listsView(){
  var blocks=CATS.map(function(c){
    var its=state.items.filter(function(i){return i.cat===c.id;});
    var done=its.filter(function(i){return i.status==='done';}).length;
    return '<section class="lblock" style="--h:'+c.h+'" aria-label="'+esc(c.name)+'">'+
      '<button type="button" class="lhead" data-action="open" data-cat="'+c.id+'" aria-label="Open '+esc(c.name)+'"><span class="ldot"></span><span class="lname">'+esc(c.name)+'</span><span class="lcount">'+done+'/'+its.length+'</span>'+ICON.chev+'</button>'+
      listBody(c,its)+'</section>';
  }).join('');
  return '<header class="top"><h1 class="brand">All lists</h1><p class="sub">'+CATS.length+' lists. Start something and it moves to Home</p></header><div class="lgrid">'+blocks+'</div>';
}
function listView(){
  var c=byId[state.cat],items=state.items.filter(function(i){return i.cat===c.id;});
  return '<div class="opened" style="--h:'+c.h+'"><button type="button" class="back" data-action="nav" data-view="lists">'+ICON.back+'All lists</button>'+
    '<h1 class="list-title">'+esc(c.name)+'</h1><p class="list-q">'+esc(c.q)+'</p>'+
    listBody(c,items)+'</div>';
}
function navHtml(){
  var home=state.view==='home';
  var ih='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5l2 2 3.5-4M3.5 15.5l2 2 3.5-4M13 7h8M13 16h8"/></svg>';
  var il='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>';
  return '<button type="button" data-action="nav" data-view="home"'+(home?' aria-current="page"':'')+'>'+ih+'Home</button>'+
         '<button type="button" data-action="nav" data-view="lists"'+(!home?' aria-current="page"':'')+'>'+il+'Lists</button>';
}

function render(){
  app.classList.toggle('wide',state.view==='lists');
  app.classList.toggle('boardwide',state.view==='home');
  app.innerHTML=state.view==='home'?homeView():state.view==='lists'?listsView():listView();
  navEl.innerHTML=navHtml();
  if(state.refocus){var el=document.getElementById(state.refocus);if(el)el.focus();state.refocus=null;}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-action]');if(!t)return;
  var a=t.getAttribute('data-action'),id=t.getAttribute('data-id');
  if(a==='add'){submitAdd(t.closest('.phf, .add'));return;}
  if(a==='nav'){state.view=t.getAttribute('data-view');state.cat=null;window.scrollTo(0,0);}
  else if(a==='open'){state.view='list';state.cat=t.getAttribute('data-cat');window.scrollTo(0,0);}
  else if(a==='filter'){state.filter=t.getAttribute('data-cat');}
  else if(a==='cycle'){var it=state.items.find(function(i){return i.id===id;});if(it)setStatus(id,NEXT[it.status]);}
  else if(a==='setstatus'){setStatus(id,t.getAttribute('data-to'));}
  else if(a==='remove'){removeItem(id);}
  else if(a==='undo'){undoRemove();}
  else if(a==='shuffle'){shuffle();}
  render();
});
function submitAdd(box){
  if(!box)return;
  var inp=box.querySelector('input[type=text]');
  if(!inp||!inp.value.trim())return;
  var isPh=box.classList.contains('phf');
  var sel=box.querySelector('#add-cat');
  var cat=isPh?box.getAttribute('data-fixed'):(sel?sel.value:state.lastCat);
  addItem(cat,inp.value,state.view==='home');
  state.refocus=isPh?'ph-'+cat+'-0':inp.id;
  render();
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.isComposing)return;
  var t=e.target;
  if(!t||t.tagName!=='INPUT')return;
  var box=t.closest('.phf, .add');
  if(!box)return;
  e.preventDefault();
  submitAdd(box);
});
/* keep the input focused while tapping Add (stops the keyboard flicker on phones) */
document.addEventListener('mousedown',function(e){
  var b=e.target.closest&&e.target.closest('[data-action="add"]');
  if(b)e.preventDefault();
});

render();
})();
</script>
</body>
</html>
