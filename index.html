<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FB; --ink:#151B33; --muted:#566080; --line:#DADFEE;
  --accent:#FFD23F; --navy:#151B33;
  --cs:62%; --cl:34%;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1122; --ink:#EEF0FF; --muted:#9BA2C9; --line:#2A3050;
    --cs:70%; --cl:72%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1122; --ink:#EEF0FF; --muted:#9BA2C9; --line:#2A3050;
  --cs:70%; --cl:72%;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-bottom:110px; -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px}
.wrap.wide{max-width:920px}
.wrap.boardwide{max-width:960px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0;font-size:14px}

/* Do this now strip */
.pick{background:var(--accent);color:var(--navy);border-radius:16px;padding:16px 18px;margin-bottom:22px;max-width:720px}
.pick :focus-visible{outline-color:var(--navy)}
.pick-lead{margin:0 0 2px;font-weight:600;font-size:14px}
.pick-title{font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.12;letter-spacing:-.02em;margin:0 0 4px}
.pick-from{margin:0 0 14px;font-size:14px;font-weight:500;opacity:.8}
.pick-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:42px;font-weight:600;font-size:15px;cursor:pointer;line-height:1.1}
.btn.dark{background:var(--navy);color:var(--accent)}
.btn.line{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.pick.swap{animation:swap .22s ease-out}
@keyframes swap{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

.hint{margin:4px 0 0;font-size:14px;color:var(--muted)}


/* Section headings */
.sec-h{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sec-h svg{flex:none;width:22px;height:22px}
.sec-h h3{font-weight:800;font-size:20px;letter-spacing:-.01em}
.n{font-size:14px;font-weight:600;color:var(--muted)}

/* Rows */
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);min-height:58px;position:relative}
.chk{flex:none;width:46px;height:46px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);margin-left:-10px;border-radius:50%}
.chk svg{width:26px;height:26px;display:block}
.chk .ck{stroke:var(--bg)}
.chk:active svg{transform:scale(.88)}
.rt{flex:1;min-width:0;padding:8px 0}
.txt{display:block;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
button.txt{background:none;border:0;padding:0;margin:0;text-align:left;width:100%;cursor:text}
.edit-in{display:block;width:100%;font-family:inherit;font-size:17px;line-height:1.3;color:var(--ink);background:transparent;border:0;border-radius:0;padding:0;margin:0;box-shadow:0 2px 0 var(--accent);resize:none;overflow:hidden;overflow-wrap:anywhere;min-height:0}
.edit-in:focus-visible{outline:none}
.cat{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;margin-top:3px;color:hsl(var(--h) var(--cs) var(--cl))}
.cat i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px;vertical-align:middle}
.x{flex:none;width:40px;height:40px;border:0;background:transparent;color:var(--muted);border-radius:50%;cursor:pointer;display:grid;place-items:center;opacity:.75}
.x:hover,.x:focus-visible{opacity:1;color:var(--ink)}
.bcol .pbtn{margin-top:12px}
.rmeta{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:2px}
.rmeta .onhome{margin:0}
.tlabel{font-size:12px;font-weight:600;color:var(--muted)}
.ct{color:var(--muted);font-weight:500}
.onhome{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.onhome::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent);margin-right:6px;vertical-align:middle}
.row[data-status="done"] .txt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.empty{color:var(--muted);padding:14px 0;margin:0;border-bottom:1px solid var(--line);font-size:15px}

/* Empty placeholder rows: blank lines you can type into */
.row.ph .phf{display:flex;align-items:center;gap:4px;width:100%}
.ph .pc{flex:none;width:46px;height:46px;display:grid;place-items:center;color:var(--muted);opacity:.35;margin-left:-10px}
.ph .pc svg{width:26px;height:26px}
.ph input{flex:1;min-width:0;background:transparent;border:0;font-size:17px;padding:12px 0;min-height:46px}
.ph input::placeholder{color:var(--muted);opacity:.5}
.ph input:focus-visible{outline:none}
.ph:focus-within{border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.ph .padd{display:none;flex:none;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;min-height:34px}
.ph:focus-within .padd,.ph input:not(:placeholder-shown)~.padd{display:inline-block}

/* Lists overview: every list visible, two columns */
.lgrid{column-count:2;column-gap:28px}
.lblock{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;margin:0 0 30px}
.lhead-row{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.lhead{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0;cursor:pointer;min-height:36px}
.ldot{flex:none;width:14px;height:14px;border-radius:50%;background:hsl(var(--h) var(--cs) var(--cl))}
.lname{display:block;flex:1;min-width:0;font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.lcount{flex:none;font-size:14px;font-weight:600;color:var(--muted);text-align:right}
.lhead svg{flex:none;color:var(--muted)}
.lblock .row{min-height:46px}
.lblock .rt{padding:6px 0}
.lblock .chk,.lblock .ph .pc{width:38px;height:38px;margin-left:-8px}
.lblock .chk svg,.lblock .ph .pc svg{width:22px;height:22px}
.lblock .txt{font-size:15px}
.lblock .edit-in{font-size:15px}
.lblock .x{width:32px;height:32px}
.lblock .x svg{width:15px;height:15px}
.lblock .ph input{font-size:15px;min-height:42px;padding:6px 0}
.lblock .ph .padd{padding:6px 11px;min-height:30px;font-size:12px}
@media (max-width:480px){
  .lgrid{column-gap:14px}
  .lhead{gap:6px}
  .lname{font-size:16px}
  .lblock .txt{font-size:14px}
  .lhead svg{display:none}
}

/* Reorder lists by dragging */
.lhead{cursor:grab;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dragtip{margin:-10px 0 20px}
.lblock.drag-ghost{position:fixed;left:0;top:0;z-index:950;margin:0;display:block;box-sizing:content-box;padding:10px 12px;pointer-events:none;background:var(--bg);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.3);transform-origin:0 0;will-change:transform}
body.dragging,body.dragging *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}

/* Create and remove lists */
.ltools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pbtn{border:0;border-radius:999px;padding:10px 18px;min-height:42px;font-weight:600;font-size:15px;cursor:pointer;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.pbtn.prim{background:var(--accent);color:var(--navy);box-shadow:none}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.newlist{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:6px 0;margin:0 0 26px;max-width:620px}
.newlist input{flex:1 1 220px;min-width:0;background:transparent;border:0;font-size:18px;font-weight:600;padding:10px 0;min-height:44px}
.newlist input::placeholder{color:var(--muted);font-weight:400}
.newlist input:focus-visible{outline:none}
.newlist:focus-within{border-bottom-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.rm-list{flex:none;width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:50%;cursor:pointer;display:grid;place-items:center}
.rm-list:hover,.rm-list:focus-visible{color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.dangerlink{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;padding:12px 0;min-height:44px;margin-top:14px}
.dangerlink:hover{color:var(--ink)}
@media (max-width:480px){.editing .lcount{display:none}}

/* Idea library */
.idea-btn{flex:none;width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:50%;cursor:pointer;display:grid;place-items:center}
.idea-btn:hover,.idea-btn:focus-visible{color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}
.ideas-bar{margin:0 0 18px;display:flex;gap:8px;flex-wrap:wrap}
.pbtn .bi{display:inline-flex;vertical-align:middle;margin-right:8px}
.pbtn .bi svg{display:block}
.ideas{background:color-mix(in srgb,hsl(var(--h) var(--cs) var(--cl)) 10%,transparent);border-radius:16px;padding:14px 16px 8px;margin:0 0 26px}
.ideas-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ideas-h h2{font-weight:800;font-size:20px;letter-spacing:-.01em}
.idea-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);min-height:58px;padding:6px 0}
.idea-row:last-child{border-bottom:0}
.idea-row .txt{flex:1;min-width:0}
.iadd{flex:none;border:0;background:var(--accent);color:var(--navy);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;min-height:38px}
.ideas .empty{border-bottom:0}
@media (max-width:480px){.lcount{display:none}.ideas{padding:12px 12px 6px}}

/* Opened list */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--muted);font-weight:600;padding:8px 8px 8px 0;margin-bottom:4px;cursor:pointer;min-height:40px}
.list-title{font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.05;letter-spacing:-.025em;color:hsl(var(--h) var(--cs) var(--cl))}
.list-q{color:var(--muted);margin:6px 0 18px}
.opened .rows{border-top:2px solid var(--ink)}
.opened .ideas .rows{border-top:0}

/* Home board: three columns side by side */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px;align-items:start}
.bcol{min-width:0}
@media (max-width:600px){
  .wrap.boardwide{padding-left:12px;padding-right:12px}
  .board{gap:8px}
  .bcol .sec-h{flex-wrap:wrap;gap:2px 6px;padding-bottom:6px}
  .bcol .sec-h svg{width:16px;height:16px}
  .bcol .sec-h h3{font-size:13px;line-height:1.15}
  .bcol .n{font-size:12px}
  .bcol .row{display:block;min-height:0;padding:2px 0 10px}
  .bcol .chk{width:36px;height:36px;margin:0 0 0 -6px}
  .bcol .chk svg{width:22px;height:22px}
  .bcol .rt{padding:0}
  .bcol .txt,.bcol .edit-in{font-size:13.5px;line-height:1.25}
  .bcol .cat{font-size:11px;margin-top:4px}
  .bcol .x{position:absolute;top:1px;right:-6px;width:34px;height:34px}
  .bcol .x svg{width:15px;height:15px}
  .bcol .empty{font-size:13px;padding:10px 0}
  .bcol .pbtn{padding:8px 12px;min-height:36px;font-size:13px}
}

/* Tagging and time filter */
.tcount{display:inline-block;background:var(--accent);color:var(--navy);border-radius:999px;padding:1px 8px;margin-left:8px;font-size:12px;font-weight:700}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;min-height:40px;cursor:pointer}
.tchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tnote{margin:0 0 16px}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;cursor:pointer}
.tagpanel{background:color-mix(in srgb,hsl(var(--h) var(--cs) var(--cl)) 10%,transparent);border-radius:16px;padding:16px;margin:0 0 8px}
.tag-left{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.tag-text{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:clamp(22px,5.5vw,32px);line-height:1.15;letter-spacing:-.02em;margin:6px 0 4px;overflow-wrap:anywhere}
.tag-from{margin:0 0 16px;font-size:14px;font-weight:600;color:hsl(var(--h) var(--cs) var(--cl))}
.tag-btns{display:flex;gap:8px;margin-bottom:12px}
.tbtn{flex:1;min-height:56px;border:2px solid var(--ink);background:transparent;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer}
.tbtn:hover,.tbtn:focus-visible{background:var(--accent);color:var(--navy);border-color:var(--accent)}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-bottom:1px solid var(--line);padding:10px 0}
.tmain{flex:1 1 200px;min-width:0}
.wtxt.fin{color:var(--muted);text-decoration:line-through}
.tseg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.tseg button{border:0;background:transparent;padding:7px 14px;min-height:38px;font-weight:600;font-size:13px;cursor:pointer}
.tseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Wins */
.winpill{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--accent);color:var(--navy);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;letter-spacing:.08em;cursor:pointer;min-height:40px}
.wins-total{font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1.05;letter-spacing:-.025em}
.wins-sub{color:var(--muted);margin:6px 0 18px}
.wstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 16px}
.wstat{background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:12px;padding:12px 14px}
.wstat p{margin:0;font-size:13px;color:var(--muted)}
.wstat strong{display:block;font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.1}
.mstones{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.ms{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.ms.on{background:var(--accent);color:var(--navy);border-color:transparent}
.bylist{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbar{height:8px;border-radius:6px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.bbar b{display:block;height:100%;border-radius:6px;background:hsl(var(--h,220) var(--cs) var(--cl))}
.bc{font-weight:600;color:var(--muted)}
.winsec{margin-top:26px}
.winrow{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);min-height:60px;padding:6px 0}
.wchk{flex:none;width:26px;height:26px;color:var(--ink)}
.wchk svg{width:26px;height:26px;display:block}
.wchk .ck{stroke:var(--bg)}
.wmain{flex:1;min-width:0}
.wtxt{display:block;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.wmeta{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.wl{font-weight:600;color:hsl(var(--h,220) var(--cs) var(--cl))}
.chk.pop svg{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

/* Vision board */
.vsub{color:var(--muted);margin:0 0 16px}
.note{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 16px}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.vtile{position:relative;display:block;aspect-ratio:1/1;padding:0;border:0;background:color-mix(in srgb,var(--ink) 10%,var(--bg));overflow:hidden;cursor:pointer;border-radius:0}
.vtile img,.vtile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vtile:hover::after,.vtile:focus-visible::after{content:"";position:absolute;top:0;bottom:0;left:0;right:0;background:rgba(0,0,0,.18)}
.vtile:focus-visible{outline-offset:-3px}
.badge{position:absolute;top:8px;right:8px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));display:flex}
.vtile.busy{cursor:default;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.vempty{text-align:center;padding:44px 16px 24px;color:var(--muted)}
.vcam{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;border:2px solid var(--ink);color:var(--ink);margin-bottom:16px}
.vempty h2{font-weight:800;font-size:24px;color:var(--ink);margin-bottom:6px}
.vempty p{max-width:34ch;margin:0 auto}
body.lock{overflow:hidden}
.viewer{position:fixed;top:0;bottom:0;left:0;right:0;z-index:900;background:rgba(6,8,18,.97);display:flex;flex-direction:column;color:#fff}
.viewer[hidden]{display:none}
.v-top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 6px}
.v-btn{width:46px;height:46px;border:0;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.v-btn:hover{background:rgba(255,255,255,.12)}
.viewer :focus-visible{outline-color:#fff}
.v-count{font-size:14px;font-weight:600;opacity:.85}
.v-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.v-stage img,.v-stage video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.v-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;cursor:pointer}
.v-arrow.prev{left:10px}
.v-arrow.next{right:10px}
.v-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;max-width:720px;width:100%;margin:0 auto}
.v-cap{background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.3);color:#fff;font-size:17px;padding:8px 0;min-height:44px;border-radius:0}
.v-cap::placeholder{color:rgba(255,255,255,.55)}
.v-cap:focus-visible{outline:none;border-bottom-color:var(--accent)}
.v-date{font-size:13px;opacity:.7}

/* Nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav-in{pointer-events:auto;display:flex;gap:4px;background:var(--ink);padding:5px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.nav button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--bg);padding:11px 22px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;min-height:46px}
.nav button[aria-current="page"]{background:var(--accent);color:var(--navy)}
.nav :focus-visible{outline-color:var(--accent)}
@media (max-width:420px){.nav-in{gap:2px}.nav button{padding:11px 15px;gap:6px}}
.toast{z-index:1100;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 10px 8px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s;max-width:calc(100% - 32px);text-align:center;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1}
.toast.act.show{pointer-events:auto}
.toast button{border:0;background:var(--accent);color:var(--navy);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;min-height:32px}
.toast:not(.act){padding-right:18px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

var IDEA_BATCH=8;
var LINES=5; /* every list shows five lines: filled items first, then empty placeholders */
var NEW_IDS=['certifications','ideas','dreams','everyday','family']; /* lists added after the first release */
var NOT_ON_HOME=['passion','purpose','money','products'].concat(NEW_IDS); /* the other ten start on the Home board */

var KEY='nextup-v4';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.items))return d;}}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:state.items,seeded:state.seeded,cats:state.cats,wins:state.wins}));}catch(e){}}
function seedItem(c){return {id:uid(),cat:c.id,text:c.common,status:'todo',onHome:NOT_ON_HOME.indexOf(c.id)<0};}

var state={view:'home',cat:null,lastCat:null,pickId:null,flash:false,refocus:null,undo:null,editing:false,creating:false,ideasOpen:false,ideaPage:{},media:[],mediaReady:false,persist:true,busy:0,viewer:null,refocusTile:null,editId:null,wins:[],winsMore:false,popId:null,timeFilter:'all',tagSkipped:[],cats:[],items:[],seeded:[]};
(function(){
  var saved=load();
  if(saved){
    state.cats=Array.isArray(saved.cats)?saved.cats:CATS.map(clone);
    state.items=saved.items;
    state.seeded=saved.seeded||CATS.map(function(c){return c.id;}).filter(function(id){return NEW_IDS.indexOf(id)<0;});
  }else{
    state.cats=CATS.map(clone);
  }
  reindex();
  state.items=state.items.filter(function(i){return byId[i.cat];});
  /* the wins log: older saved data has none, so anything already finished is counted once */
  state.wins=saved&&Array.isArray(saved.wins)?saved.wins:state.items.filter(function(i){return i.status==='done';}).map(function(i){
    return {id:uid(),itemId:i.id,text:i.text,cat:i.cat,catName:byId[i.cat]?byId[i.cat].name:'',at:Date.now()};
  });
  /* a built-in list that has not had its starter item yet gets one (first visit, or a list added in a newer version) */
  state.cats.forEach(function(c){
    if(c.common&&state.seeded.indexOf(c.id)<0){state.items.push(seedItem(c));state.seeded.push(c.id);}
  });
  save();
})();

var app=document.getElementById('app'),navEl=document.getElementById('nav'),toastEl=document.getElementById('toast'),toastTimer;
function toast(msg,withUndo,ms){
  toastEl.textContent='';
  var s=document.createElement('span');s.textContent=msg;toastEl.appendChild(s);
  if(withUndo){var b=document.createElement('button');b.type='button';b.setAttribute('data-action','undo');b.textContent='Undo';toastEl.appendChild(b);}
  toastEl.classList.toggle('act',!!withUndo);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},withUndo?5000:(ms||1800));
}

var LABEL={todo:'To do',doing:'In progress',done:'Done'};
var EMPTY={doing:'Nothing started yet.',todo:'Nothing queued yet.',done:'Nothing finished yet.'};
var NEXT={todo:'doing',doing:'done',done:'todo'};
var ACTION={todo:'Start',doing:'Finish',done:'Move back to to do'};

function homeItems(){return state.items.filter(function(i){return i.onHome;});}

function choose(pool){
  var p=pool.filter(function(i){return i.status==='doing';});
  if(!p.length)p=pool.filter(function(i){return i.status==='todo';});
  return p.length?p[Math.floor(Math.random()*p.length)]:null;
}
function currentPick(pool){
  var it=state.items.find(function(i){return i.id===state.pickId;});
  if(!it||it.status==='done'||pool.indexOf(it)<0){it=choose(pool);state.pickId=it?it.id:null;}
  return it;
}
function shuffle(){
  var pool=homeItems().filter(function(i){return i.status!=='done'&&i.id!==state.pickId;});
  if(!pool.length){toast('That is the only open item in this view');return;}
  state.pickId=pool[Math.floor(Math.random()*pool.length)].id;
  state.flash=true;
}
function setStatus(id,to){
  var it=state.items.find(function(i){return i.id===id;});
  if(!it||it.status===to)return;
  var wasHome=it.onHome,was=it.status;
  it.status=to;if(to!=='todo')it.onHome=true;
  var msg=!wasHome&&it.onHome?'Moved to Home as '+LABEL[to]:'Moved to '+LABEL[to],ms;
  if(to==='done'){
    state.wins.push({id:uid(),itemId:it.id,text:it.text,cat:it.cat,catName:byId[it.cat]?byId[it.cat].name:'',at:Date.now()});
    msg=winMessage(state.wins.length);ms=WIN_TEXT[state.wins.length]?3400:2400;state.popId=it.id;
  }else if(was==='done'){
    var before=state.wins.length;
    state.wins=state.wins.filter(function(w){return w.itemId!==it.id;});
    if(state.wins.length<before)msg='Back to '+LABEL[to]+'. That win was taken back.';
  }
  save();toast(msg,false,ms);
}
/* ---------- wins ---------- */
var MILESTONES=[1,10,25,50,100,250,500,1000];
var WIN_TEXT={1:'Your first win. Nice.',10:'10 wins. Double digits.',25:'25 wins. That is a real habit.',50:'50 wins. Halfway to 100.',100:'100 wins. Be proud of that.',250:'250 wins. Look how far you have come.',500:'500 wins. Unstoppable.',1000:'1,000 wins. Remarkable.'};
function winMessage(n){return WIN_TEXT[n]||('Nice. That is win number '+n+'.');}
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function prevDay(t){var d=new Date(t);d.setDate(d.getDate()-1);d.setHours(0,0,0,0);return d.getTime();}
function winStats(){
  var today=dayStart(Date.now()),days={},list=[];
  state.wins.forEach(function(w){var k=dayStart(w.at);if(!days[k]){days[k]=true;list.push(k);}});
  list.sort(function(a,b){return a-b;});
  var cur=0,t=days[today]?today:(days[prevDay(today)]?prevDay(today):null);
  while(t!==null&&days[t]){cur++;t=prevDay(t);}
  var best=0,run=0;
  list.forEach(function(k,i){run=(i>0&&prevDay(k)===list[i-1])?run+1:1;if(run>best)best=run;});
  var from=today;for(var n=0;n<6;n++)from=prevDay(from);
  var week=state.wins.filter(function(w){return w.at>=from;}).length;
  return {cur:cur,best:best,week:week};
}
function removeWin(id){
  var idx=state.wins.findIndex(function(w){return w.id===id;});
  if(idx<0)return;
  state.undo={type:'win',w:state.wins[idx],idx:idx};
  state.wins.splice(idx,1);save();toast('Win removed',true);
}
function addItem(cat,text,onHome){
  text=text.trim();if(!text)return;
  state.items.push({id:uid(),cat:cat,text:text,status:'todo',onHome:!!onHome});
  state.lastCat=cat;save();toast(onHome?'Added to To do':'Added to the list');
}
function removeItem(id){
  var idx=state.items.findIndex(function(i){return i.id===id;});
  if(idx<0)return;
  state.undo={type:'item',item:state.items[idx],idx:idx};
  state.items.splice(idx,1);save();toast('Deleted',true);
}
function createList(name){
  name=name.trim().slice(0,40);if(!name)return null;
  var id='c-'+Math.random().toString(36).slice(2,8);
  state.cats.unshift({id:id,name:name,q:'Your own list',h:Math.floor(Math.random()*360),custom:true});
  reindex();save();toast('List created');
  return id;
}
function removeList(id){
  var idx=state.cats.findIndex(function(c){return c.id===id;});
  if(idx<0)return;
  state.undo={type:'list',cat:state.cats[idx],idx:idx,items:state.items.filter(function(i){return i.cat===id;})};
  state.cats.splice(idx,1);
  state.items=state.items.filter(function(i){return i.cat!==id;});
  if(state.lastCat===id)state.lastCat=null;
  reindex();save();toast('List removed',true);
}
function undoRemove(){
  var u=state.undo;if(!u)return;
  if(u.type==='win'){state.wins.splice(Math.min(u.idx,state.wins.length),0,u.w);state.undo=null;save();toast('Restored');return;}
  if(u.type==='media'){
    state.media.splice(Math.min(u.idx,state.media.length),0,u.m);
    dbTx('readwrite',function(st){return st.put(toRecord(u.m));}).catch(function(){});
    state.undo=null;toast('Restored');return;
  }
  if(u.type==='list'){
    state.cats.splice(Math.min(u.idx,state.cats.length),0,u.cat);
    state.items=state.items.concat(u.items);
    reindex();
  }else{
    state.items.splice(Math.min(u.idx,state.items.length),0,u.item);
  }
  state.undo=null;save();toast('Restored');
}
function doCreate(){
  var inp=document.getElementById('new-list-name');
  if(!inp||!inp.value.trim())return;
  var id=createList(inp.value);
  state.creating=false;state.refocus='ph-'+id+'-0';
  render();
}

/* ---------- Vision board: photos and videos, saved in the browser (IndexedDB) ---------- */
var MAX_BYTES=300*1048576;
var DB=null;
function dbOpen(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open('nextup-media',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('media',{keyPath:'id'});};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
      r.onblocked=function(){rej(new Error('blocked'));};
    }catch(e){rej(e);}
  });
}
function dbTx(mode,fn){
  return new Promise(function(res,rej){
    if(!DB){res(null);return;}
    try{
      var tx=DB.transaction('media',mode),out=fn(tx.objectStore('media'));
      tx.oncomplete=function(){res(out&&out.result!==undefined?out.result:null);};
      tx.onerror=function(){rej(tx.error);};
      tx.onabort=function(){rej(tx.error||new Error('abort'));};
    }catch(e){rej(e);}
  });
}
function dbDelete(id){return dbTx('readwrite',function(st){return st.delete(id);}).catch(function(){});}
function toRecord(m){return {id:m.id,type:m.type,blob:m.blob,thumb:m.thumb,caption:m.caption||'',created:m.created,name:m.name};}
function hydrate(r){
  return {id:r.id,type:r.type,blob:r.blob,thumb:r.thumb||null,caption:r.caption||'',created:r.created,name:r.name,
    url:URL.createObjectURL(r.blob),turl:r.thumb?URL.createObjectURL(r.thumb):null};
}
function isMediaFile(f){return /^(image|video)\//.test(f.type)||/\.(jpe?g|png|gif|webp|avif|heic|heif|mp4|mov|m4v|webm)$/i.test(f.name||'');}
function isVideoFile(f){return /^video\//.test(f.type)||/\.(mp4|mov|m4v|webm)$/i.test(f.name||'');}
function loadImage(blob){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(blob),im=new Image();
    var t=setTimeout(function(){URL.revokeObjectURL(u);rej(new Error('timeout'));},10000);
    im.onload=function(){clearTimeout(t);res({im:im,url:u});};
    im.onerror=function(){clearTimeout(t);URL.revokeObjectURL(u);rej(new Error('image'));};
    im.src=u;
  });
}
function scaleBlob(im,max,q){
  var w=im.naturalWidth,h=im.naturalHeight,r=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  return new Promise(function(res){c.toBlob(res,'image/jpeg',q);});
}
function videoThumb(blob){
  return new Promise(function(res){
    var u=URL.createObjectURL(blob),v=document.createElement('video'),done=false,t;
    function fin(b){if(done)return;done=true;clearTimeout(t);URL.revokeObjectURL(u);res(b);}
    t=setTimeout(function(){fin(null);},5000);
    v.muted=true;v.playsInline=true;v.preload='metadata';
    v.onloadeddata=function(){try{v.currentTime=Math.min(0.5,(v.duration||1)/4);}catch(e){fin(null);}};
    v.onseeked=function(){
      try{
        var w=v.videoWidth,h=v.videoHeight;if(!w||!h){fin(null);return;}
        var r=Math.min(1,480/Math.max(w,h)),c=document.createElement('canvas');
        c.width=Math.round(w*r);c.height=Math.round(h*r);
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        c.toBlob(function(b){fin(b);},'image/jpeg',.8);
      }catch(e){fin(null);}
    };
    v.onerror=function(){fin(null);};
    v.src=u;
  });
}
/* Photos are shrunk to a sensible size and get a small thumbnail so the grid stays fast. Videos are kept as they are. */
async function prepareMedia(f,created){
  var video=isVideoFile(f);
  var rec={id:uid(),type:video?'video':'image',caption:'',created:created,name:f.name||'',blob:f,thumb:null};
  if(video){rec.thumb=await videoThumb(f);return rec;}
  try{
    var li=await loadImage(f),im=li.im;
    if(Math.max(im.naturalWidth,im.naturalHeight)>2000||f.size>3*1048576){
      var big=await scaleBlob(im,2000,.88);
      if(big&&big.size<f.size)rec.blob=big;
    }
    rec.thumb=await scaleBlob(im,480,.8);
    URL.revokeObjectURL(li.url);
  }catch(e){/* keep the original file; the browser may still be able to show it */}
  return rec;
}
async function addFiles(files){
  var list=files.filter(isMediaFile);
  if(!list.length){toast('Choose photos or videos');return;}
  var ok=0,fail=0,now=Date.now();
  state.busy=list.length;render();
  for(var k=0;k<list.length;k++){
    try{
      if(list[k].size>MAX_BYTES)throw new Error('too large');
      var rec=await prepareMedia(list[k],now-k);
      if(DB)await dbTx('readwrite',function(st){return st.put(rec);});
      state.media.splice(ok,0,hydrate(rec));ok++;
    }catch(e){fail++;}
    state.busy--;render();
  }
  state.busy=0;render();
  toast(fail?(ok?'Added '+ok+', skipped '+fail:'Could not add that file (too large or not supported)'):'Added '+ok+(ok===1?' item':' items'));
}
var capTimer=null,capId=null;
function flushCaption(){
  clearTimeout(capTimer);capTimer=null;
  if(capId){var m=state.media.find(function(x){return x.id===capId;});if(m)dbTx('readwrite',function(st){return st.put(toRecord(m));}).catch(function(){});capId=null;}
}
function removeMedia(id){
  var idx=state.media.findIndex(function(m){return m.id===id;});
  if(idx<0)return;
  flushCaption();
  state.undo={type:'media',m:state.media[idx],idx:idx};
  state.media.splice(idx,1);
  dbDelete(id);
  if(state.viewer!=null)state.viewer=state.media.length?Math.min(state.viewer,state.media.length-1):null;
  renderViewer();render();toast('Deleted',true);
}

  }else inner='<img src="'+(m.turl||m.url)+'" alt="" loading="lazy">';
  return '<button type="button" class="vtile" data-action="openmedia" data-i="'+i+'" aria-label="Open '+(m.type==='video'?'video':'picture')+' '+(i+1)+' of '+state.media.length+(m.caption?': '+esc(m.caption):'')+'">'+inner+'</button>';

var drag=null,suppressUntil=0;
function moveCat(id,dir){
  var i=state.cats.findIndex(function(c){return c.id===id;}),j=i+dir;
  if(i<0||j<0||j>=state.cats.length)return;

function reduceMotion(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function ghostTransform(scale){return 'translate3d('+(drag.x-drag.offX-12)+'px,'+(drag.y-drag.offY-10)+'px,0) scale('+scale+')';}
function placeGhost(){if(drag&&drag.ghost)drag.ghost.style.transform=ghostTransform(1.03);}
function startDrag(){
  if(!drag||drag.active)return;
  drag.active=true;clearTimeout(drag.timer);
  var r=drag.blk.getBoundingClientRect();
  var g=drag.blk.cloneNode(true);
  g.className='lblock drag-ghost';g.setAttribute('aria-hidden','true');g.setAttribute('inert','');
  g.removeAttribute('data-cat');
  [].slice.call(g.querySelectorAll('[id]')).forEach(function(n){n.removeAttribute('id');});
  [].slice.call(g.querySelectorAll('[data-action],[data-cat]')).forEach(function(n){n.removeAttribute('data-action');n.removeAttribute('data-cat');});
  g.style.width=(r.width-24)+'px';
  document.body.appendChild(g);
  drag.ghost=g;drag.offX=drag.x0-r.left;drag.offY=drag.y0-r.top;drag.lastMove=0;
  drag.blk.style.visibility='hidden';          /* the slot stays empty, like a missing puzzle piece */
  document.body.classList.add('dragging');
  try{drag.head.setPointerCapture(drag.pid);}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}
  g.style.transform=ghostTransform(1);
  void g.offsetWidth;
  g.style.transition='transform 140ms ease';   /* a short lift, then it follows the pointer with no lag */
  placeGhost();
  setTimeout(function(){g.style.transition='none';},170);

/* FLIP: remember where every list is, change the order, then slide each list from its old spot to its new one */
function flip(mutate){
  var bs=[].slice.call(document.querySelectorAll('.lgrid .lblock'));
  var first=bs.map(function(b){return b.getBoundingClientRect();});
  bs.forEach(function(b){b.style.transition='none';b.style.transform='';});
  mutate();
  var moved=[];
  bs.forEach(function(b,i){
    if(b===drag.blk)return;
    var l=b.getBoundingClientRect(),dx=first[i].left-l.left,dy=first[i].top-l.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    b.style.transform='translate('+dx+'px,'+dy+'px)';moved.push(b);
  });
  if(!moved.length)return;
  void document.body.offsetWidth;
  moved.forEach(function(b){
    b.style.transition='transform 240ms cubic-bezier(.2,.8,.2,1)';
    b.style.transform='';
  });
}
function reorderAt(x,y){
  if(!drag||!drag.active||Date.now()-drag.lastMove<120)return;
  var el=document.elementFromPoint(x,y);
  var tb=el&&el.closest?el.closest('.lgrid .lblock'):null;
  if(!tb||tb===drag.blk)return;
  var r=tb.getBoundingClientRect(),before=y<r.top+r.height/2,parent=drag.blk.parentNode;
  if(before&&tb.previousElementSibling===drag.blk)return;

function autoscroll(){

function endDrag(commit){

    document.body.classList.remove('dragging');d.blk.style.visibility='';

      var map={};state.cats.forEach(function(c){map[c.id]=c;});
      var next=[].slice.call(document.querySelectorAll('.lgrid .lblock')).map(function(b){return map[b.getAttribute('data-cat')];}).filter(Boolean);
      if(next.length===state.cats.length&&next.some(function(c,i){return c!==state.cats[i];})){state.cats=next;save();toast('Order saved');}
    }
    render();
  }
  if(d.ghost&&commit&&!reduceMotion()){
    /* the piece settles into its slot */
    var r=d.blk.getBoundingClientRect();
    d.ghost.style.transition='transform 200ms cubic-bezier(.2,.8,.2,1), box-shadow 200ms ease';
    d.ghost.style.transform='translate3d('+(r.left-12)+'px,'+(r.top-10)+'px,0) scale(1)';

})();
/* load saved pictures */
dbOpen().then(function(db){DB=db;return dbTx('readonly',function(st){return st.getAll();});}).then(function(rows){
  (rows||[]).sort(function(a,b){return b.created-a.created;}).forEach(function(r){state.media.push(hydrate(r));});
  state.mediaReady=true;if(state.view==='vision')render();
}).catch(function(){
  DB=null;state.persist=false;state.mediaReady=true;if(state.view==='vision')render();
});

render();
})();
</script>
</body>
</html>
